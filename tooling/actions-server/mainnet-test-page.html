<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Falou e Provou — teste mainnet (assinatura recorrente)</title>
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<link rel="icon" type="image/svg+xml" href="../../landing/assets/mark.svg" />
<style>
  /* Tinta sobre Creme — the operator pages run the same palette as the
     landing page and the docs. See docs/docs/project/design-system.md. */
  :root {
    --cream: #f4f0e5;
    --cream-deep: #ebe5d6;
    --ink: #0e3d3f;
    --ink-soft: #427070;
    --turquoise: #0a7575;
    --vermilion: #c0391b;
    --hairline: color-mix(in srgb, var(--ink) 12%, transparent);
    --font-sans: 'Inter', -apple-system, ui-sans-serif, system-ui, sans-serif;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    max-width: 620px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .mark { width: 40px; height: 40px; display: block; margin-bottom: 1.25rem; }
  .eyebrow {
    display: block;
    font-weight: 500;
    font-size: 0.6875rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--vermilion);
    margin-bottom: 0.6rem;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.75rem, 6vw, 2.5rem);
    line-height: 1.1;
    margin: 0 0 1rem;
  }
  .lede { color: var(--ink-soft); font-size: 0.9375rem; margin: 0 0 2rem; }
  .row { margin: 0.75rem 0; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  label {
    font-weight: 500;
    font-size: 0.6875rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    min-width: 12rem;
  }
  input {
    background: var(--cream);
    border: 1px solid var(--hairline);
    color: var(--ink);
    padding: 0.55rem 0.7rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.875rem;
    width: 8rem;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--turquoise); outline-offset: 2px; }
  button {
    background: var(--turquoise);
    color: var(--cream);
    border: 1px solid transparent;
    padding: 0.8rem 1.35rem;
    border-radius: 4px;
    font-family: var(--font-sans);
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
    margin: 1.5rem 0.5rem 0 0;
    transition: background-color 0.16s ease;
  }
  button:hover:not(:disabled) { background: var(--ink); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  code { font-family: var(--font-mono); font-size: 0.875em; }
  #log {
    background: color-mix(in srgb, var(--cream-deep) 55%, transparent);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 1.1rem 1.25rem;
    margin-top: 1.75rem;
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    color: var(--ink-soft);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.7;
    min-height: 7rem;
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <g stroke="#0a7575" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14 60C36 46 58 52 70 70" stroke-width="9" stroke-opacity="0.82"/>
      <path d="M14 136C36 150 58 144 70 126" stroke-width="9" stroke-opacity="0.82"/>
      <path d="M78 48C112 40 156 42 182 50C190 78 190 122 182 148C150 158 106 158 78 148C70 120 70 76 78 48Z" stroke-width="8.5"/>
      <path d="M96 100C104 110 111 118 118 127C134 105 150 84 166 64" stroke-width="11"/>
    </g>
  </svg>
  <span class="eyebrow">Mainnet · dinheiro real</span>
  <h1>Autorizar assinatura recorrente</h1>
  <p class="lede">Conecta a Phantom, propõe a transação de autorização (via nosso Actions server local em <code>localhost:8788</code>), você assina. O agente nunca vê sua chave.</p>

  <div class="row">
    <label>Valor por período (USDC)</label>
    <input id="amount" value="0.05" />
  </div>
  <div class="row">
    <label>Período (segundos)</label>
    <input id="period" value="60" />
  </div>

  <button id="connect">1. Conectar Phantom</button>
  <button id="authorize" disabled>2. Autorizar assinatura</button>

  <div id="log">Aguardando conexão...</div>

  <script>
    const log = (msg) => {
      const el = document.getElementById("log");
      el.textContent += "\n" + msg;
      el.scrollTop = el.scrollHeight;
    };

    const ACTIONS_BASE = "http://localhost:8788";
    let provider = null;
    let publicKey = null;

    document.getElementById("connect").onclick = async () => {
      if (!window.solana || !window.solana.isPhantom) {
        log("❌ Phantom não encontrado. Instale a extensão e recarregue a página.");
        return;
      }
      provider = window.solana;
      try {
        const resp = await provider.connect();
        publicKey = resp.publicKey;
        log("✅ Conectado: " + publicKey.toString());
        document.getElementById("authorize").disabled = false;
      } catch (e) {
        log("❌ Conexão recusada: " + e.message);
      }
    };

    async function signAndSend(base64Tx, label) {
      const bytes = Uint8Array.from(atob(base64Tx), (c) => c.charCodeAt(0));
      const tx = solanaWeb3.VersionedTransaction.deserialize(bytes);
      log(`Pedindo assinatura na Phantom para: ${label}...`);
      const { signature } = await provider.signAndSendTransaction(tx);
      log(`Enviado. Assinatura: ${signature}`);
      log("Aguardando confirmação on-chain (polling manual, não trava o fluxo se a RPC pública bloquear)...");
      const connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com", "confirmed");
      let confirmed = false;
      for (let i = 0; i < 15 && !confirmed; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        try {
          const { value } = await connection.getSignatureStatuses([signature]);
          const st = value && value[0];
          if (st && (st.confirmationStatus === "confirmed" || st.confirmationStatus === "finalized")) {
            if (st.err) throw new Error("Transação falhou on-chain: " + JSON.stringify(st.err));
            confirmed = true;
          }
        } catch (e) {
          log(`(aviso: checagem de status falhou nessa tentativa: ${e.message} — seguindo tentando)`);
        }
      }
      if (confirmed) {
        log(`✅ Confirmado: ${label} — https://solscan.io/tx/${signature}`);
      } else {
        log(`⚠️ Não consegui confirmar por aqui (RPC pública instável), mas a Phantom já enviou. Assinatura: ${signature} — seguindo mesmo assim.`);
      }
      return signature;
    }

    document.getElementById("authorize").onclick = async () => {
      document.getElementById("authorize").disabled = true;
      const amount = Number(document.getElementById("amount").value) * 1_000_000; // 6 decimals
      const period = document.getElementById("period").value;

      try {
        log("--- Passo 1: pedindo transação ao Actions server ---");
        const step1 = await fetch(`${ACTIONS_BASE}/actions/authorize-subscription?amount=${amount}&period_s=${period}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account: publicKey.toString() }),
        }).then((r) => r.json());

        if (step1.error) throw new Error(step1.error);
        log("Mensagem do servidor: " + step1.message);

        const sig1 = await signAndSend(step1.transaction, "passo 1 (init + criar delegação, ou só delegação se já tiver conta)");

        if (step1.links && step1.links.next) {
          log("--- Passo 2 (encadeado): finalizando a assinatura ---");
          const step2 = await fetch(`${ACTIONS_BASE}${step1.links.next.href}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ account: publicKey.toString(), signature: sig1 }),
          }).then((r) => r.json());

          if (step2.error) throw new Error(step2.error);
          log("Mensagem do servidor: " + step2.message);
          await signAndSend(step2.transaction, "passo 2 (criar delegação)");
        }

        log("\n🎉 Assinatura recorrente autorizada de verdade, em mainnet.");
      } catch (e) {
        log("❌ Erro: " + (e.message || e));
      } finally {
        document.getElementById("authorize").disabled = false;
      }
    };
  </script>
</body>
</html>
